{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="card mx-auto mt-10 max-w-md">
  <h1 class="text-xl font-semibold">Choose a new password</h1>
  <form method="post" class="mt-4 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="lbl">New password (8+ characters)<input class="field" type="password" name="new" minlength="8" required autofocus></label>
    <label class="lbl">Confirm new password<input class="field" type="password" name="confirm" required></label>
    <button class="btn btn-primary w-full">Save password</button>
  </form>
</section>
{% endblock %}
