{% extends "base.html" %}{% block title %}Choose new password{% endblock %}{% block content %}<div class="auth-page"><section class="panel form-card" style="width:min(470px,100%)"><div class="eyebrow">Account recovery</div><h1 class="page-title" style="font-size:25px">Choose a new password</h1><p class="page-subtitle">Use at least 8 characters, then confirm it below.</p><form method="post" class="form-stack" style="margin-top:20px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label>New password</label><input class="field" type="password" name="new" minlength="8" required></div><div class="form-field"><label>Confirm password</label><input class="field" type="password" name="confirm" minlength="8" required></div><button class="button primary">Update password</button></form></section></div>{% endblock %}
