{% extends "base.html" %}{% block title %}Reset password{% endblock %}{% block content %}<div class="auth-page"><section class="panel form-card" style="width:min(470px,100%)"><div class="eyebrow">Account recovery</div><h1 class="page-title" style="font-size:25px">Forgot your password?</h1><p class="page-subtitle">Enter your registered email and, if the account exists, we'll send a reset link.</p><form method="post" class="form-stack" style="margin-top:20px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label>Email address</label><input class="field" type="email" name="email" required></div><button class="button primary">Send reset link</button><a class="button" href="{{ url_for('auth.login') }}">Back to sign in</a></form></section></div>{% endblock %}
