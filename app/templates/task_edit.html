{% extends "base.html" %}{% from "_macros.html" import icon %}{% block title %}Edit task{% endblock %}{% block content %}<div class="page-header"><div><div class="eyebrow">Task management</div><h1 class="page-title">Edit task</h1><p class="page-subtitle">Update the task details and keep the board accurate.</p></div><a class="button" href="{{ url_for('groups.board', group_id=task.group_id) }}">Back to board</a></div><section class="panel form-card" style="max-width:760px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label>Task title</label><input class="field" name="title" maxlength="120" value="{{ task.title }}" required></div><div class="form-field" style="margin-top:14px"><label>Description</label><textarea class="field" name="description" maxlength="500" rows="4" placeholder="What should the team know about this task?">{{ task.description }}</textarea></div><div class="form-grid" style="margin-top:14px"><div class="form-field"><label>Assign to</label><select class="field" name="assigned_to" {{ '' if me.is_leader else 'disabled' }}><option value="">Unassigned</option>{% for m in members %}<option value="{{ m.user_id }}" {{ 'selected' if m.user_id == task.assigned_to }}>{{ m.user.name }}</option>{% endfor %}</select></div><div class="form-field"><label>Deadline</label><input class="field" type="date" name="deadline" value="{{ task.deadline or '' }}"></div><div class="form-field"><label>Priority</label><select class="field" name="priority">{% for p in ['low','medium','high'] %}<option value="{{ p }}" {{ 'selected' if p == task.priority }}>{{ p|capitalize }}</option>{% endfor %}</select></div><div class="form-field"><label>Status</label><select class="field" name="status">{% for k,l in [('todo','To do'),('doing','In progress'),('review','In review'),('done','Done')] %}<option value="{{ k }}" {{ 'selected' if k == task.status }}>{{ l }}</option>{% endfor %}</select></div></div><div class="form-actions"><button class="button primary">{{ icon('check','icon-sm') }} Save changes</button><a class="button" href="{{ url_for('groups.board', group_id=task.group_id) }}">Cancel</a></div></form></section>{% endblock %}
