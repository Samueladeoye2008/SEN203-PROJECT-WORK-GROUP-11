{% extends "base.html" %}
{% block title %}Edit task{% endblock %}
{% block content %}
<section class="card mx-auto max-w-lg">
  <h1 class="text-xl font-semibold">Edit task</h1>
  <form method="post" class="mt-4 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="lbl">Title<input class="field" name="title" maxlength="120" value="{{ task.title }}" required></label>
    <label class="lbl">Notes<textarea class="field" name="description" maxlength="500" rows="3">{{ task.description }}</textarea></label>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="lbl">Assign to
        <select class="field" name="assigned_to" {{ '' if me.is_leader else 'disabled' }}>
          <option value="">Unassigned</option>
          {% for m in members %}<option value="{{ m.user_id }}" {{ 'selected' if m.user_id == task.assigned_to }}>{{ m.user.name }}</option>{% endfor %}
        </select></label>
      <label class="lbl">Deadline<input class="field" type="date" name="deadline" value="{{ task.deadline or '' }}"></label>
      <label class="lbl">Priority
        <select class="field" name="priority">{% for p in ['low','medium','high'] %}<option value="{{ p }}" {{ 'selected' if p == task.priority }}>{{ p|capitalize }}</option>{% endfor %}</select></label>
      <label class="lbl">Status
        <select class="field" name="status">{% for k,l in [('todo','To do'),('doing','In progress'),('review','In review'),('done','Done')] %}<option value="{{ k }}" {{ 'selected' if k == task.status }}>{{ l }}</option>{% endfor %}</select></label>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary">Save changes</button>
      <a class="btn" href="{{ url_for('groups.board', group_id=task.group_id) }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
